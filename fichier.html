<!DOCTYPE html>
<html lang="fr">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mizan</title>
    <meta name="description" content="mizan est une platform qui met en disponibilité de ses utilisateurs tous les changements qui concernent les metaux.">
    <link rel="stylesheet" href="./assets/tailwind.css">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./partie-2/main.js" defer></script>
</head>
<body>
    <header class="flex bg-blue-950 justify-between">
        <div class= "py-2 flex">
            <div>
                <img class="w-40 h-20" src="assets/images/Balance de justice dorée sur fond transparent.png" alt="logo de mizan">
            </div>
            <div>
                <h1 class="text-white font-serif text-5xl py-3">Mizan</h1>
            </div>
        </div>
    </header>





<div id="modal-suppression" class="fixed inset-0 z-50 items-center justify-center p-4 w-150 mx-90 my-30 hidden">
    <div class="bg-white rounded-xl p-8 w-150 text-center">

        <h2 class="text-xl font-bold mb-4">Confirmation de suppression</h2>

        <p class="text-gray-600 mb-6">
            Voulez-vous vraiment supprimer cet article ?
        </p>

        <div class="flex justify-center gap-4">
            
            <button class="bg-red-700 text-white border rounded w-40 h-10" id="confirmer-suppression" type="button">
                Confirmer
            </button>

            <button class="bg-gray-300 text-white border rounded w-40 h-10" id="annuler-suppression" type="button">
                Annuler
            </button>

        </div>

    </div>
</div>


    <main>
        
        <section class="flex justify-end">
            <div>
                <h1 class="text-4xl font-bold flex justify-start pt-30  flex-nowrap">Catalogue de bijoux</h1>
                <h4 class="text-xl font-serif pt-4 ">Consulter et gérer la collection Al Andalous</h4>
            </div>
            <div class="flex  py-0">
                <img class="h-80 w-150" src="assets/images/hero.png" alt="hero de mizan">
            </div>
        </section>
    <div>
    <p class="text-blue-900 text-2xl fixed top-5 right-5 z-50 px-10 py-3 rounded-lg shadow-lg font-bold hidden" id="chargement">Chargement des articles en cours...</p>
    </div>

        <form class="border border-gray-500 rounded-xl bg-white p-8 h-150 px-10" id="form" novalidate>

                <h2 class="text-xl font-semibold text-blue-950 mt-10 mb-6"> Ajouter un article </h2>

            <div class="grid grid-cols-3 gap-6 mt-10">
                <div class="flex flex-col gap-2">
                    <label class="font-medium text-gray-700 text-2xl" for="title">Titre</label>
                    <input class="border border-gray-300 rounded-lg px-4 py-3" type="text" id="titreajout" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-medium text-gray-700 text-2xl" for="description">Description</label>
                    <input class="border border-gray-300 rounded-lg px-4 py-3" type="text" id="descriptionajout" required>
                </div>
                <div  class="flex flex-col gap-2">
                    <label class="font-medium text-gray-700 text-2xl" for="statut">Statut</label>
                    <input class="border border-gray-300 rounded-lg px-4 py-3" type="text" id="statutajout">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-medium text-gray-700 text-2xl" for="prix">Prix</label>
                    <input class="border border-gray-300 rounded-lg px-4 py-3" type="number" id="prixajout" required>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-medium text-gray-700 text-2xl" for="date">Date</label>
                    <input class="border border-gray-300 rounded-lg px-4 py-3" type="date" id="dateajout">
                </div>
            </div>

            <div class="flex justify-center gap-4 mt-8">
                <button class="bg-blue-950 text-white px-6 py-2 rounded-lg w-50" type="submit" id="ajouter">Ajouter</button>
                <button class="border border-gray-300 text-gray-600 px-6 py-2 rounded-lg w-50" type="button" id="annuler">Annuler</button>
                <p class="text-red-500 text-center text-xl font-semibold hidden" id="messageerreur"></p>
            </div>
        </form>



        <section class="flex gap-40 justify-evenly border rounded h-35 bg-blue-950 text-white mt-10">
        <div >
            <input class="border rounded bg-white text-black font-serif my-10 h-10" id="rechercher" type="text" placeholder="Rechercher">
        </div>
        <div>
            <select class="border rounded bg-white text-black font-serif my-10 h-10 w-50" name="statut" id="statut">
                <option value="null" disabled selected>statut</option>
                <option value="disponible">Disponible</option>
                <option value="indisponible">Indisponible</option>
            </select>
        </div>
        <div>
            <select class="border rounded bg-white text-black font-serif my-10 h-10 w-50" name="trier" id="Trier">
                <option value="null" disabled selected>Trier par</option>
                <option value="ordreA">Titre: (A -> Z)</option>
                <option value="ordreP">Prix: croissant</option>
                <option value="ordreD">Date: récent</option>
            </select>
        </div>
        </section>

        <section id="listesbijoux" class="grid grid-cols-3 gap-6 mt-10">
        </section>
    </main>
        <footer>
        <div class="flex flex-col items-center mt-10">
            <p class="text-2xl font-semibold">Rester a-jour grace a Mizan</p>
            <p class="text-xl font-thin">Toute l'actualité des métaux précieux a votre disposition</p>
        </div>
    </footer>







</body>
</html>
